name: Slack Deployment Command for Design System Test
#Slack deployment command for design system on test
on:
  repository_dispatch:
    types:
      - slack-deploy-command-for-design-system-test

jobs:

  integrity:
    name: Slack Integrity Check
    runs-on: ubuntu-24.04
    timeout-minutes: 1

    steps:

      # Validate that the command is called from deployment-dev (calling it does not affect BR stuff)
      - name: Checking source
        uses: actions/github-script@v6
        env:
          AGENT: ${{ github.event.client_payload.integrity.agent }}
          BODY: ${{ github.event.client_payload.integrity.body }}
          CHANNEL_ID: ${{ github.event.client_payload.data.channel_id }}
          SIGNATURE: ${{ github.event.client_payload.integrity.signature }}
          SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          TIMESTAMP: ${{ github.event.client_payload.integrity.timestamp }}
          BRANCH: ${{ github.event.client_payload.data.text }}
        if: ${{ env.CHANNEL_ID !='C026PH4GQSH' }}
        with:
          script: |
            core.setFailed('Caller source not verified!')

      - name: Validate Slack request and branch
        uses: actions/github-script@v6
        env:
          AGENT: ${{ github.event.client_payload.integrity.agent }}
          BODY: ${{ github.event.client_payload.integrity.body }}
          SIGNATURE: ${{ github.event.client_payload.integrity.signature }}
          SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          TIMESTAMP: ${{ github.event.client_payload.integrity.timestamp }}
          BRANCH: ${{ github.event.client_payload.data.text }}
        with:
          script: |
            const crypto = require('crypto');
            const agent = process.env.AGENT || '';
            const timestamp = process.env.TIMESTAMP || '';
            const body = process.env.BODY || '';
            const signature = process.env.SIGNATURE || '';
            const secret = process.env.SIGNING_SECRET || '';
            const branch = (process.env.BRANCH || '').trim();

            if (!agent.startsWith('Slackbot')) {
              core.setFailed('User agent mismatch.');
              return;
            }

            const base = `v0:${timestamp}:${body}`;
            const hash = crypto.createHmac('sha256', secret).update(base).digest('hex');
            if (signature !== `v0=${hash}`) {
              core.setFailed('The origin integrity check failed.');
              return;
            }

            if (!branch) {
              core.setFailed('No branch was supplied. Use /test-design-system <branch>.');
            }

  #
  # Build homepage distribution from source
  #
  build_homepage:
    name: "Build Homepage Distribution"
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.client_payload.data.text }}

    steps:
      #
      # Step 1
      # Checkout the project's sourcecode
      #
      - name: Checkout
        uses: actions/checkout@v7

      #
      # Step 2
      # Set Node.js version
      #
      - name: Request Node Version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: homepage/package-lock.json

      #
      # Step 3
      #
      - name: Initialise NPM
        run: npm ci
        working-directory: homepage

      #
      # Step 4
      #
      - name: Build dist folder
        run: npm run build
        working-directory: homepage

      #
      # Step 5
      # Store homepage distribution workflow artifacts
      #
      - name: Archive dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homepage-dist
          path: homepage/dist/

  #
  # Build CDN Distribution from source
  #
  build_dist:
    name: "Build CDN Distribution"
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.client_payload.data.text }}

    steps:
      #
      # Step 1
      # Checkout the project's sourcecode
      #
      - name: Checkout
        uses: actions/checkout@v7

      #
      # Step 2
      # Set Node.js version
      #
      - name: Request Node Version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      #
      # Step 3
      #
      - name: Initialise NPM
        run: npm ci

      #
      # Step 4
      #
      - name: Build dist folder
        run: npm run dist:build:prod

      #
      # Step 5
      # Store CDN distribution workflow artifacts
      #
      - name: Archive dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdn-dist
          path: |
            dist/fonts/
            dist/icons/
            dist/images/
            dist/scripts/
            dist/static/
            dist/stylesheets/


  #
  # Build Storybook from source
  #
  build_storybook:
    name: "Build Storybook Distribution"
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.client_payload.data.text }}
    steps:
      #
      # Step 1
      # Checkout the project's sourcecode
      #
      - name: Checkout
        uses: actions/checkout@v7

      #
      # Step 2
      # Set Node.js version
      #
      - name: Request Node Version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      #
      # Step 3
      #
      - name: Initialise NPM
        run: npm ci

      #
      # Step 4
      # Build storybook project
      #
      - name: Build Storybook
        env:
          STORYBOOK_VERSION: ${{ env.BRANCH }}
        run: npm run storybook:build

      #
      # Step 5
      # Store Storybook workflow artifacts
      #
      - name: Archive storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-dist
          path: storybook-static/

  #
  # Build NPM Package from source
  #
  build_npm_package:
    name: "Build NPM Distribution"
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.client_payload.data.text }}

    steps:

      #
      # Step 1
      # Checkout the project's sourcecode
      #
      - name: Checkout
        uses: actions/checkout@v7

      #
      # Step 2
      # Set Node.js version
      #
      - name: Request Node Version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      #
      # Step 3
      #
      - name: Initialise NPM
        run: npm ci

      #
      # Step 4
      #
      - name: Build NPM
        run: npm run package:build:prod

      #
      # Step 5
      # Store NPM Package workflow artifacts
      #
      - name: Archive NPM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: |
            package/

  #
  # Put CDN distribution artifact onto the S3 origin.
  #
  dist_cdn:
    name: "Distribute CDN"
    needs:
      - build_dist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: ${{ github.event.client_payload.data.text }}
      S3_BUCKET: ${{ secrets.TEST_S3_ORIGIN }}

    steps:

      #
      # Step 1
      # Download CDN artifact and merge version artifact into the same folder
      #
      - name: Download CDN artifacts
        uses: actions/download-artifact@v4
        id: download
        with:
          name: cdn-dist
          path: cdn-dist

      #
      # Step 2
      # Set up AWS CLI
      #
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.TEST_PIPELINE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_PIPELINE_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      #
      # Step 3
      # Publish both the branch-specific and latest CDN distributions
      #
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Publish branch and latest CDN distributions
        working-directory: ${{steps.download.outputs.download-path}}
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/cdn/${BRANCH}" --delete
          aws s3 sync . "s3://${S3_BUCKET}/cdn/latest" --delete

  #
  # Put the Storybook distribution artifact onto the S3 origin.
  #
  dist_storybook:
    name: "Distribute Storybook"
    needs:
      - build_storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: ${{ github.event.client_payload.data.text }}
      S3_BUCKET: ${{ secrets.TEST_S3_ORIGIN }}

    steps:
      #
      # Step 1
      # Download CDN artifact and merge version artifact into the same folder
      #
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        id: download
        with:
          name: storybook-dist
          path: storybook-dist

      #
      # Step 2
      # Set up AWS CLI
      #
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.TEST_PIPELINE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_PIPELINE_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      #
      # Step 3
      # Publish both the branch-specific and latest Storybook distributions
      #
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Publish branch and latest Storybook distributions
        working-directory: ${{steps.download.outputs.download-path}}
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/storybook/${BRANCH}" --delete
          aws s3 sync . "s3://${S3_BUCKET}/storybook/latest" --delete

  #
  # Put the homepage distribution artifact onto the test S3 origin.
  #
  # Keep the homepage at the bucket root, as the production distribution does,
  # while preserving the CDN and Storybook prefixes deployed above.
  #
  dist_homepage:
    name: "Distribute Homepage"
    needs:
      - build_homepage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_BUCKET: ${{ secrets.TEST_S3_ORIGIN }}

    steps:

      - name: Download homepage artifacts
        uses: actions/download-artifact@v4
        id: download
        with:
          name: homepage-dist
          path: homepage-dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.TEST_PIPELINE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_PIPELINE_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Replace homepage and its assets
        working-directory: ${{steps.download.outputs.download-path}}
        run: >-
          aws s3 sync . "s3://${S3_BUCKET}/"
          --exclude "cdn/*"
          --exclude "storybook/*"
          --exclude "error.html"
          --delete

  #
  # Invalidate cached latest assets after all distributions are updated.
  #
  clear_cache:
    name: "Clear Test CloudFront Cache"
    needs:
      - dist_cdn
      - dist_storybook
      - dist_homepage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.TEST_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.TEST_PIPELINE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_PIPELINE_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Invalidate latest test assets
        if: ${{ env.TEST_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${TEST_CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/storybook/latest/*" "/cdn/latest/*" "/index.html"

      - name: Report missing CloudFront distribution configuration
        if: ${{ env.TEST_CLOUDFRONT_DISTRIBUTION_ID == '' }}
        run: echo "TEST_CLOUDFRONT_DISTRIBUTION_ID is not configured; latest assets may remain cached."
